[project]
name = "redline-reports"
version = "0.1.0"
description = "Reports, posts and data for the jubarte RedlineBench study, plus the script that recomputes their score intervals."
requires-python = ">=3.12"
dependencies = ["numpy>=2"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.8", "mypy>=1.13"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# No retries: a failing test fails the run.
addopts = "--cov=scripts --cov-branch --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
source = ["scripts"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["scripts", "tests"]
mypy_path = "scripts"
